<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - additive animation - skinning</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			a {
				color: blue;
			}
			.control-inactive button {
				color: #888;
			}
		</style>
	</head>
	<body>
		<div id="container"></div>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Skeletal Additive Animation Blending
			(model from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">mixamo.com</a>)<br/>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			// three.js 核心库
			import * as THREE from 'three';

			// FPS 性能监控面板
			import Stats from 'three/addons/libs/stats.module.js';

			// GUI 控制面板（调权重、切动画）
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			// 轨道控制器（鼠标旋转相机）
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			// glTF / GLB 模型加载器
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			// ====== 全局变量 ======
			let scene, renderer, camera, stats;
			let model, skeleton, mixer, clock;

			// GUI 中“基础动作”按钮的引用，用于高亮 / 置灰
			const crossFadeControls = [];

			// 当前正在播放的基础动作
			let currentBaseAction = 'idle';

			// 所有 AnimationAction 的集合（用于统一更新权重）
			const allActions = [];

			// ====== 基础动作（只能选一个）=====
			const baseActions = {
				idle: { weight: 1 },
				walk: { weight: 0 },
				run:  { weight: 0 }
			};

			// ====== 叠加动作（可多个同时生效）=====
			// additive 动画不会“替换”姿态，而是在当前姿态上叠加
			const additiveActions = {
				sneak_pose: { weight: 0 },
				sad_pose:   { weight: 0 },
				agree:     { weight: 0 },
				headShake: { weight: 0 }
			};

			let panelSettings, numAnimations;

			init();

			function init() {

				const container = document.getElementById('container');

				// Clock 用来计算每一帧的 deltaTime
				clock = new THREE.Clock();

				// ====== 场景 ======
				scene = new THREE.Scene();
				scene.background = new THREE.Color(0xa0a0a0);
				scene.fog = new THREE.Fog(0xa0a0a0, 10, 50);

				// 半球光（环境光）
				const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8d8d8d, 3);
				hemiLight.position.set(0, 20, 0);
				scene.add(hemiLight);

				// 平行光（主光源 + 阴影）
				const dirLight = new THREE.DirectionalLight(0xffffff, 3);
				dirLight.position.set(3, 10, 10);
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 2;
				dirLight.shadow.camera.bottom = -2;
				dirLight.shadow.camera.left = -2;
				dirLight.shadow.camera.right = 2;
				dirLight.shadow.camera.near = 0.1;
				dirLight.shadow.camera.far = 40;
				scene.add(dirLight);

				// ====== 地面 ======
				const mesh = new THREE.Mesh(
					new THREE.PlaneGeometry(100, 100),
					new THREE.MeshPhongMaterial({ color: 0xcbcbcb, depthWrite: false })
				);
				mesh.rotation.x = -Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add(mesh);

				// ====== 加载模型 ======
				const loader = new GLTFLoader();
				loader.load('models/gltf/Xbot.glb', function (gltf) {

					// 模型本体
					model = gltf.scene;
					scene.add(model);

					// 所有 Mesh 开启投射阴影
					model.traverse(function (object) {
						if (object.isMesh) object.castShadow = true;
					});

					// 骨骼辅助线（调试用）
					skeleton = new THREE.SkeletonHelper(model);
					skeleton.visible = false;
					scene.add(skeleton);

					// ====== 动画系统 ======
					const animations = gltf.animations;

					// AnimationMixer：动画混合的“总控制器”
					mixer = new THREE.AnimationMixer(model);

					numAnimations = animations.length;

					for (let i = 0; i !== numAnimations; ++i) {

						let clip = animations[i];
						const name = clip.name;

						// ====== 基础动作 ======
						if (baseActions[name]) {

							const action = mixer.clipAction(clip);
							activateAction(action);

							// 保存 action 供之后切换
							baseActions[name].action = action;
							allActions.push(action);

						}
						// ====== 叠加动作 ======
						else if (additiveActions[name]) {

							// 把动画转换成“叠加动画”
							THREE.AnimationUtils.makeClipAdditive(clip);

							// pose 动画只截取关键帧的一小段
							if (clip.name.endsWith('_pose')) {
								clip = THREE.AnimationUtils.subclip(
									clip,        // 原始 AnimationClip（完整动画）
									clip.name,   // 新子动画的名字（通常沿用原名）
									2,           // 起始帧（from frame）
									3,           // 结束帧（to frame）
									30           // 帧率（fps：每秒 30 帧）
								);
							}

							const action = mixer.clipAction(clip);
							activateAction(action);

							additiveActions[name].action = action;
							allActions.push(action);
						}
					}

					// 创建 GUI 面板
					createPanel();

					// 启动渲染循环
					renderer.setAnimationLoop(animate);
				});

				// ====== 渲染器 ======
				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.shadowMap.enabled = true;
				container.appendChild(renderer.domElement);

				// ====== 相机 ======
				camera = new THREE.PerspectiveCamera(
					45, window.innerWidth / window.innerHeight, 1, 100
				);
				camera.position.set(-1, 2, 3);

				const controls = new OrbitControls(camera, renderer.domElement);
				controls.enablePan = false;
				controls.enableZoom = false;
				controls.target.set(0, 1, 0);
				controls.update();

				// FPS 面板
				stats = new Stats();
				container.appendChild(stats.dom);

				window.addEventListener('resize', onWindowResize);
			}

			// ====== GUI 面板 ======
			function createPanel() {

				const panel = new GUI({ width: 310 });

				const folder1 = panel.addFolder('Base Actions');
				const folder2 = panel.addFolder('Additive Action Weights');
				const folder3 = panel.addFolder('General Speed');

				panelSettings = {
					'modify time scale': 1.0
				};

				// “None” + idle / walk / run
				const baseNames = ['None', ...Object.keys(baseActions)];

				for (let i = 0, l = baseNames.length; i !== l; ++i) {

					const name = baseNames[i];
					const settings = baseActions[name];

					// 点击按钮 → 切换基础动画
					panelSettings[name] = function () {

						const currentSettings = baseActions[currentBaseAction];
						const currentAction = currentSettings ? currentSettings.action : null;
						const action = settings ? settings.action : null;

						if (currentAction !== action) {
							prepareCrossFade(currentAction, action, 0.35);
						}
					};

					crossFadeControls.push(folder1.add(panelSettings, name));
				}

				// additive 动画使用滑块控制权重
				for (const name of Object.keys(additiveActions)) {

					const settings = additiveActions[name];

					panelSettings[name] = settings.weight;

					folder2
						.add(panelSettings, name, 0.0, 1.0, 0.01)
						.listen()
						.onChange(function (weight) {
							setWeight(settings.action, weight);
							settings.weight = weight;
						});
				}

				// 全局动画播放速度
				folder3
					.add(panelSettings, 'modify time scale', 0.0, 1.5, 0.01)
					.onChange(modifyTimeScale);

				folder1.open();
				folder2.open();
				folder3.open();

				// 控制按钮的高亮 / 置灰
				crossFadeControls.forEach(function (control) {

					control.setInactive = function () {
						control.domElement.classList.add('control-inactive');
					};

					control.setActive = function () {
						control.domElement.classList.remove('control-inactive');
					};

					const settings = baseActions[control.property];
					if (!settings || !settings.weight) {
						control.setInactive();
					}
				});
			}

			// ====== 激活动画 ======
			function activateAction(action) {

				const clip = action.getClip();
				const settings = baseActions[clip.name] || additiveActions[clip.name];

				// 设置初始权重
				setWeight(action, settings.weight);

				// 加入 mixer 并开始播放
				action.play();
			}

			// 修改整个 mixer 的播放速度
			function modifyTimeScale(speed) {
				mixer.timeScale = speed;
			}

			// ====== 准备动画切换 ======
			function prepareCrossFade(startAction, endAction, duration) {

				// idle → 其他：立即切
				// 其他 → 其他：等当前动作播放完一圈再切
				if (currentBaseAction === 'idle' || !startAction || !endAction) {
					executeCrossFade(startAction, endAction, duration);
				} else {
					synchronizeCrossFade(startAction, endAction, duration);
				}

				// 更新当前基础动作名称
				if (endAction) {
					currentBaseAction = endAction.getClip().name;
				} else {
					currentBaseAction = 'None';
				}

				// 更新 GUI 状态
				crossFadeControls.forEach(function (control) {
					control.property === currentBaseAction
						? control.setActive()
						: control.setInactive();
				});
			}

			// ====== 等当前动作 loop 完再切换 ======
			function synchronizeCrossFade(startAction, endAction, duration) {

				mixer.addEventListener('loop', onLoopFinished);

				function onLoopFinished(event) {

					// 只监听“起始动画”的 loop 事件
					if (event.action === startAction) {

						// 只执行一次
						mixer.removeEventListener('loop', onLoopFinished);

						// 正式执行交叉淡入淡出
						executeCrossFade(startAction, endAction, duration);
					}
				}
			}

			// ====== 执行交叉淡入淡出 ======
			function executeCrossFade(startAction, endAction, duration) {

				if (endAction) {

					// 目标动画权重必须为 1
					setWeight(endAction, 1);

					// 从第一帧开始播放
					endAction.time = 0;

					if (startAction) {
						// 动作 → 动作（自动 warp 时间）
						startAction.crossFadeTo(endAction, duration, true);
					} else {
						// None → 动作
						endAction.fadeIn(duration);
					}

				} else {
					// 动作 → None
					startAction.fadeOut(duration);
				}
			}

			// ====== 统一设置动画权重 ======
			// crossFadeTo 会修改 timeScale 和 enabled，这里强制恢复
			function setWeight(action, weight) {
				action.enabled = true;
				action.setEffectiveTimeScale(1);
				action.setEffectiveWeight(weight);
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			function animate() {

				// 同步 GUI 中显示的权重
				for (let i = 0; i !== numAnimations; ++i) {
					const action = allActions[i];
					const clip = action.getClip();
					const settings = baseActions[clip.name] || additiveActions[clip.name];
					settings.weight = action.getEffectiveWeight();
				}

				// 计算 deltaTime
				const mixerUpdateDelta = clock.getDelta();

				// 更新动画
				mixer.update(mixerUpdateDelta);

				// 渲染
				renderer.render(scene, camera);

				// 更新 FPS
				stats.update();
			}

		</script>


	</body>
</html>
